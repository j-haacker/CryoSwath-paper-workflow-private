# Decides whether each resource is to `downloaded` or `produced`. Note
# that `produced` may use substantial resources and may take longer to
# finish.
calval_source: downloaded
coverage_analysis_source: downloaded
glacierized_area_source: downloaded
elevation_timeseries_source: downloaded
publication_artifact_source: downloaded

# Set to false only when an upstream HTTPS certificate is broken and you accept
# the risk of downloading monthly source data without TLS certificate checks.
download_verify_tls: true

# Optional Earthdata credentials for NSIDC authentication.
# Resolution order is:
# 1) these config values, 2) env vars, 3) $HOME/.netrc, 4) ./.netrc, 5) ./.nsidc_cookies
earthdata_username: ""
earthdata_password: ""

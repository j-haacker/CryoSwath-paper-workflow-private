[project]
authors = [{name = "Jan Haacker", email = "152862650+j-haacker@users.noreply.github.com"}]
dependencies = []
name = "cryoswath-paper-workflow"
requires-python = ">= 3.11"
version = "2"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
aria2 = ">=1.37.0,<2"
conda = ">=26.5.0,<27"
cryoswath = "==0.2.6"
dask = ">=2026.1.2,<2027"
distributed = ">=2026.1.2,<2027"
jupyter = ">=1.1.1,<2"
matplotlib = ">=3.10.8,<4"
pandas = ">=2,<3"
papermill = ">=2.6.0,<3"
seaborn = ">=0.13.2,<0.14"
snakemake = "==9.17.2"
sqlite = ">=3.37"
unzip = ">=6.0,<7"
wget = ">=1.25.0,<2"
imagemagick = ">=7.1.2_3,<8"

[tool.pixi.pypi-dependencies]
cryoswath_paper_workflow = { path = ".", editable = true }

[tool.pixi.tasks]
sync-envs = "bash tools/sync_envs_from_pixi.sh"
bake-nsidc-cookie = "pixi run python scripts/nsidc_cookies.py"
dry-run = "snakemake --dry-run publication_reproduction --cores"
reproduce = "snakemake publication_reproduction --cores"
